<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Coffee House</title>
    <link rel="icon" type="image/png" href="../images/coffee-logo.png">
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../style/style.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<body>
    <!-- ====================================================================
         SCREEN 1: WELCOME SCREEN ("Welcome to Coffee House")
         ==================================================================== -->
    <div id="welcome-screen" class="screen welcome-screen active">
        <div class="welcome-card">
            <!-- Welcome Artwork with Coffee House Logo -->
            <div class="artwork-container">
                <div class="welcome-poster">
                    <!-- Golden Steam Wisps -->
                    <div class="steam-container" aria-hidden="true">
                        <svg class="steam-svg" viewBox="0 0 100 45" xmlns="http://www.w3.org/2000/svg">
                            <path d="M30 40 Q 22 22 32 6 Q 36 22 30 40" fill="#d88b35"/>
                            <path d="M50 36 Q 42 16 52 2 Q 56 16 50 36" fill="#d88b35"/>
                            <path d="M68 40 Q 60 22 70 8 Q 74 22 68 40" fill="#d88b35"/>
                        </svg>
                    </div>

                    <!-- Welcome Title -->
                    <div class="welcome-title-group">
                        <div class="welcome-word">Welcome</div>
                        <div class="to-word">TO</div>
                    </div>

                    <!-- Official Coffee House Logo Medallion -->
                    <div class="welcome-logo-frame">
                        <img src="../images/coffee-logo.png" alt="Coffee House Logo" class="welcome-logo-img">
                    </div>
                </div>
            </div>

            <!-- "Get Started" Action Button -->
            <button type="button" id="btn-get-started" class="btn-get-started">
                Get Started
            </button>
        </div>
    </div>

        <!-- Login Card -->
        <div class="login-card">
            <!-- Back to Welcome Screen Button -->
            <button type="button" id="btn-back-to-welcome" class="btn-back" title="Back to Welcome">
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            <!-- Coffee Badge & Header -->
            <div class="card-header">
                <div class="logo-image-wrapper">
                    <img src="../images/coffee-logo.png" alt="Coffee House Logo" class="brand-logo-img">
                </div>
                <h1 class="card-heading">Welcome to<br>Coffee House</h1>
                <p class="card-subtitle">Sign in to enjoy your daily roast & perks</p>
            </div>

            <!-- Login Form -->
            <form class="login-form" action="#" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-box">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Dunkin@gmail.com" 
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-box password-box">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password" 
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" id="toggle-password" class="toggle-password" title="Show/Hide Password" aria-label="Toggle password">
                            <i id="eye-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-mug-saucer"></i> Sign In
                </button>
            </form>

            <!-- Demo Credentials Info Box (Coffee Roast Style) -->
            <div class="demo-box">
                <div class="demo-header">
                    <span class="demo-badge"><i class="fa-solid fa-tag"></i> DEMO ACCOUNT</span>
                </div>
                <div class="demo-details">
                    <div><strong>Email:</strong> <code>Dunkin@gmail.com</code></div>
                    <div><strong>Password:</strong> <code>Dunkin1111</code></div>
                </div>
            </div>
        </div>

    <!-- Screen Switching & Login Verification Script -->

</body>
</html>
